<div id="searchOverlay" class="search-overlay" aria-hidden="true">
  <div class="search-overlay-backdrop" data-search-close="1" tabindex="-1"></div>
  <div
    id="searchModal"
    class="search-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="searchModalTitle"
  >
    <h2 id="searchModalTitle" class="visually-hidden">Search</h2>
    <div class="search-modal-inner">
      <div class="search-input-row">
        <span class="search-input-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm0-2a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Z"
              fill="currentColor"
            />
            <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search calculators, articles, essays…"
          aria-label="Search"
        />
      </div>

      <div class="search-filters" role="toolbar" aria-label="Result type">
        <button type="button" class="search-chip is-active" data-search-filter="all">All</button>
        <button type="button" class="search-chip" data-search-filter="calculator">Calculators</button>
        <button type="button" class="search-chip" data-search-filter="article">Articles</button>
        <button type="button" class="search-chip" data-search-filter="essay">Essays</button>
      </div>

      <div id="searchDebugTokens" class="search-debug-row" aria-hidden="true"></div>

      <div id="searchResults" class="search-results" role="listbox" aria-label="Search results"></div>

      <div class="search-footer-hint">
        <span>↑↓ navigate</span>
        <span class="search-footer-sep">·</span>
        <span>↵ open</span>
        <span class="search-footer-sep">·</span>
        <span>esc close</span>
      </div>
    </div>
  </div>
</div>
